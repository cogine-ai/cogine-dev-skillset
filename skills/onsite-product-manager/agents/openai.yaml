interface:
  display_name: "Onsite Product Manager"
  short_description: "Turn customer conversations into concise product directions"
  default_prompt: "Use $onsite-product-manager. 先把完整会议文字、客户背景和我补的重点都看完，帮我发散几个值得现场验证的产品方向；给我看的部分按短模板写，详细 Context 和每个方向的开发卡分开存，先别开发。"
policy:
  allow_implicit_invocation: false
