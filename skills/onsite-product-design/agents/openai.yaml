interface:
  display_name: "Onsite Product Design"
  short_description: "Create visible design options for selected product directions"
  default_prompt: "Use $onsite-product-design. 这是我已经选好的产品方向。请主动参考 Refero 等可用设计证据，给我至少两个真正不同、能看见的设计方案。先别替我选，也别开发，展示预览后问我想用哪个。"
policy:
  allow_implicit_invocation: false
